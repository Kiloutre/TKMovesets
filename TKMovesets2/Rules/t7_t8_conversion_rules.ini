# T7 <-> retail Tekken 8 conversion rules (docs/conversion-rules.md).
# The build merges this file into a section of Resources/game_addresses.ini: the rules are embedded, downloaded and
# updated with the game addresses. A downloaded game_addresses.ini's section replaces the built-in rules only when it is
# complete, valid, of a supported format and not older; any bad line rejects the whole section. After a change, raise
# t7_t8_rules_version here and val:global_addr_version in game_addresses.ini (the build refuses otherwise).
#
# Map lines read "T7 <-> T8" (both ways), "T7 -> T8" or "T7 <- T8" (one way). A side is a value, a range a..b or an
# open range a.. ; "none" means no counterpart. Maps here are applied before the measured vote tables and the alias
# catalog built into the converters, so a line here overrides them.

val:t7_t8_rules_version = 7           # bump on every change (2: requirement conditions, 3: trail VFX ids, 4: t8_to_t7_fix, 5: id = EXPR, 6: t8_to_t7_guard, 7: wall-hit counters, sound 0x84C5)
val:t7_t8_rules_format = 1            # rule syntax; a build ignores files of a format it does not know

### Requirements
map:t7_t8_req = 881 <-> 1100               # list terminator
map:t7_t8_req = 558 <-> 667                # story checks (T8 Kazuya uses 667/668 where T7 uses 558/559)
map:t7_t8_req = 559 <-> 668
val:t7_to_t8_req_highest_case = 875        # T7 ids above this have no case in T7's evaluator: never true
list:t7_to_t8_req_known_false = 418, 739   # T7 ids with no evaluator case below 875
list:t7_to_t8_req_default_false = 560, 563, 636   # unknown flag checks that stay false (customization, game mode, assist)
val:t8_to_t7_req_never_true = 901          # unknown T8 condition in T7
val:t7_to_t8_req_never_true = 220          # unknown T7 condition in T8: identity check on an unimplemented slot
val:t7_to_t8_req_never_true_param = 0x88
val:t7_t8_req_unknown_zero_params_true = 1 # unknown "flag == 0" checks hold in normal play

### Properties (the map:t7_t8_prop overrides; none by default)
map:t7_t8_projectile_prop = 33291 <-> 0x827B   # value = projectile row
map:t7_t8_throw_prop = 33852 <-> 0x868F        # value = throw row
# Retail properties that play a hand, face, wing or camera asset by id: dropped both ways (the target's own assets
# would play).
list:t7_t8_drop_t8_props = 0x860F..0x8613, 0x8683..0x8685, 0x8780, 0x8688..0x86B0, 0x877A..0x877B
# Current-alias overwrite/reset blocks: the index is an alias slot (map:t7_t8_alias_slot), the value an own move id.
map:t7_t8_prop_alias_block = 0x83C4 <-> 0x850D
map:t7_t8_prop_alias_block = 0x83E5 <-> 0x852E
val:t7_t8_prop_alias_block_size = 33

### Requirement conditions: when a requirement holds in normal play. The converter writes an always-true or a
### never-true row instead (v = T7 parameter, p0..p4 = retail parameters). setting(NAME) reads the moveset's import
### profile (docs/import-profile.md): story_flag (default 0), in_heat (0), flags_clear (1).
# 777 Story Flag == X: versus is 0 (Jin's normal moveset and Rage Art). 1..4 are story-chapter movesets; 4 holds the
# Devil Jin moves (live: "== 4" gave T8 Jin his Devil Jin moves in T7, 2026-11-14). The profile picks the value.
t8_to_t7_req:777 = p0 == setting(story_flag)
# 476 P20 Flags (mask p0) == p1 and 439 Opponent Int Flag (field p0) == p1: the flags are clear in normal play, so a
# comparison with 0 holds. Jin's normal stance moves (up+1 -> 1622, 1, 2, 3, 4) need [476 (16, 0), 439 (0xF0000, 0)];
# as never-true they left only the story-chapter copies (live: stance up+1 did not come out).
t8_to_t7_req:476 = setting(flags_clear) & (p1 == 0)
t8_to_t7_req:439 = setting(flags_clear) & (p1 == 0)
# 1028 Player is in Heat (p0 = 1: in Heat). T7 has no Heat: the profile says whether the moveset counts as in Heat.
t8_to_t7_req:1028 = p0 == setting(in_heat)

### Parameter transforms (v = T7 value, p0..p4 = retail parameters, unset parameters are 0; t8_to_t7_prop may set id)
# A lookup without a match: "miss = drop" drops the row, otherwise the property goes through the maps unchanged.
t7_to_t8_prop:0x84C3 -> 0x87EF  p0 = v >> 24 ; p2 = v & 0xFFFFFF      # sounds: {category, 0, id}
t7_to_t8_prop:0x84C4 -> 0x87F0  p0 = v >> 24 ; p2 = v & 0xFFFFFF
t7_to_t8_prop:0x84C5 -> 0x87F1  p0 = v >> 24 ; p2 = v & 0xFFFFFF
t7_to_t8_prop:0x84C6 -> 0x87F2  p0 = v >> 24 ; p2 = v & 0xFFFFFF
t7_to_t8_prop:0x8409 -> 0x8552  p0 = lookup(t7_to_t8_battle_flag, v)    # battle flag switch
t7_to_t8_prop:0x83C2 -> 0x850B  p0 = 400 ; p1 = v                    # opponent floor level
t8_to_t7_prop:0x87EF -> 0x84C3  v = p0 << 24 | p2 & 0xFFFFFF
t8_to_t7_prop:0x87F0 -> 0x84C4  v = p0 << 24 | p2 & 0xFFFFFF
t8_to_t7_prop:0x87F1 -> 0x84C5  v = p0 << 24 | p2 & 0xFFFFFF
t8_to_t7_prop:0x87F2 -> 0x84C6  v = p0 << 24 | p2 & 0xFFFFFF
t8_to_t7_prop:0x8552 -> 0x8409  v = lookup(t8_to_t7_battle_flag, p0) ; miss = drop
t8_to_t7_prop:0x850B -> 0x83C2  v = p1
table:t7_to_t8_battle_flag = 0:0, 1:1, 2:2, 5:5, 0xB:8, 0xC:9, 0xD:0xA, 0xE:0xB
table:t8_to_t7_battle_flag = 0:0, 1:1, 2:2, 5:5, 8:0xB, 9:0xC, 0xA:0xD, 0xB:0xE
# Wall-hit counter checks (T7 283 >=, 320 <=, 358 ==; retail 287, 325, 364): T7's parameter is the threshold, retail's
# p0 is the 1-based counter index and p1 the threshold (retail handlers: P+0x1674[p0 - 1] against p1; retail data uses
# p0 = 1 and 2). T7 has one counter: it is retail counter 1. Retail rows on another counter stay never true in T7.
t7_to_t8_prop:283 -> 287  p0 = 1 ; p1 = v
t7_to_t8_prop:320 -> 325  p0 = 1 ; p1 = v
t7_to_t8_prop:358 -> 364  p0 = 1 ; p1 = v
t8_to_t7_prop:287 -> 283  id = lookup(t8_to_t7_wall_counter_ge, p0) ; v = p1 ; miss = drop
t8_to_t7_prop:325 -> 320  id = lookup(t8_to_t7_wall_counter_le, p0) ; v = p1 ; miss = drop
t8_to_t7_prop:364 -> 358  id = lookup(t8_to_t7_wall_counter_eq, p0) ; v = p1 ; miss = drop
table:t8_to_t7_wall_counter_ge = 1:283
table:t8_to_t7_wall_counter_le = 1:320
table:t8_to_t7_wall_counter_eq = 1:358
# Requirements whose T7 id depends on a retail parameter ("id = EXPR" picks it; a parameter not in the table keeps the
# row never true, as before). Paired with native T7 on the same cancels (research/t8-to-t7-paired-comparison.md):
# 0x87 "throw break" p0 = button: 5 = T7 0x83 Pressed ONLY Left Punch, 6 = 0x84 Pressed ONLY Right Punch (113 cancels
# each, 30 characters; never true before, so converted characters could not break throws). p0 7 / 8 pair with 0xB1 or
# 0x85 depending on the move: left out.
t8_to_t7_prop:0x87 -> 0x83  id = lookup(t8_to_t7_throw_break, p0) ; v = 0 ; miss = drop
table:t8_to_t7_throw_break = 5:0x83, 6:0x84
# 0x1FD "opponent facing matches param": p0 = 0xB is T7 0x5C Opponent facing Forward (199 cancels, 27 characters).
t8_to_t7_prop:0x1FD -> 0x5C  id = lookup(t8_to_t7_opponent_facing, p0) ; v = 0 ; miss = drop
table:t8_to_t7_opponent_facing = 0xB:0x5C
### Fixes on converted T7 records (T8 -> T7): t8_to_t7_fix:KIND:ID  drop = EXPR ; v = EXPR ; miss = drop
### A fix runs on the T7 value the converter is about to write, after every map and transform above, so it reaches the
### value whatever retail id or table it came from. drop = EXPR: when EXPR is not 0 the row goes (a property or
### voiceclip is left out; a requirement or cancel becomes never true). v = EXPR: the value written instead. A lookup
### miss leaves the value as it is, or with "miss = drop" drops it. One fix per KIND:ID. Comparisons: == != < <= > >=.
###   prop ID          T7 property ID in extra/start/end lists; v = T7 value, p0..p4 = retail parameters
###   req ID           T7 requirement ID; v = T7 parameter, p0..p4 = retail parameters
###   voice CATEGORY   voiceclip category; v = clip id
###   cancel CMD       cancel / group cancel with T7 command CMD; v = target move id
###   move OFFSET      u32 field of every T7 move (reference fields refused); v = field (no drop)
###   projectile OFFSET  u32 field of every T7 projectile (reference fields refused); v = field (no drop)
### The conversion report counts them (rule_fixes: changed, dropped).
# Character trail VFX (T7 0x8036, retail 0x8039 copied as is): effect id << 8 | attach point, the same in both games
# (205 of 230 paired rows). T7's effect ids are one table every character shares: the 51 native T7 movesets use 0..19,
# 27 and 31. Retail added its own (0x33, 0x74..0x85); T8 Jin's 0x790b on crouching demon stance up+1 (row 1622, frame
# 12) crashed T7 a few frames into the move, hit or whiff (live: dropping it fixed the crash, 2026-11-14). An id past
# T7's table drops the row: the move plays without that trail.
t8_to_t7_fix:prop:0x8036  drop = (v >> 8) > 31

### Guards on condition-less requirement lists (T8 -> T7)
###   t8_to_t7_guard:ID  [when = EXPR ;] id = EXPR ; v = EXPR
### A command-0 cancel whose T7 requirement list has no condition (only rows 0 and properties 0x8000 and up) is always
### true in T7: a property row there is a side effect that passes. When such a list holds property row ID (value v,
### `when` true), the cancel gets a copy of the list with the condition row {id, v} in front. Counted in the report
### (rule_fixes: guarded_lists).
# Player flags (T7 0x8106 = retail 0x8128 "set flag": v = flag << 16 | value). T8 Heihachi, Jun and Yoshimitsu idles
# (alias 0x8001) cancel into themselves through "set flag 0x1b to 0" alone, ahead of every input cancel: in T7 the idle
# restarted each frame and the character stood frozen. The reset is meant once, after a move set the flag (retail sets
# 0x1b to 0x2be / 0x2d7): guard it with T7 284 "flag >= value" (natives: Basekun 284 0x3b0003).
t8_to_t7_guard:0x8106  when = (v & 0xFFFF) == 0 ; id = 284 ; v = ((v >> 16) << 16) | 1

### Special cancel commands (other commands are copied)
map:t7_t8_cmd = 0x8000..0x8002 <-> 0x8000..0x8002
map:t7_t8_cmd = 0x8003..0x8004 <-> 0x8005..0x8006
# Unproven, kept as the old +2 offset: no T7 export uses cancel commands 0x8005..0x800A (0 rows in 156 files,
# 2026-11-14), so no pair exists to check it. One way: retail 0x8007 is a T8 sidestep cancel, not T7 0x8005.
map:t7_t8_cmd = 0x8005..0x800A -> 0x8007..0x800C
map:t7_t8_cmd = 0x800B.. <-> 0x8012..              # group cancel, group end, input sequences
# A retail special command with no rule keeps its row in T7 behind a never-true condition.

