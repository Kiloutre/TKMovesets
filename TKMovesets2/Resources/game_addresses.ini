# Generated from Rules/t7_t8_conversion_rules.ini by the build: edit that file, not this section.
# T7 <-> retail Tekken 8 conversion rules (docs/conversion-rules.md).
# The build merges this file into a section of Resources/game_addresses.ini: the rules are embedded, downloaded and
# updated with the game addresses. A downloaded game_addresses.ini's section replaces the built-in rules only when it is
# complete, valid, of a supported format and not older; any bad line rejects the whole section. After a change, raise
# t7_t8_rules_version here and val:global_addr_version in game_addresses.ini (the build refuses otherwise).
#
# Map lines read "T7 <-> T8" (both ways), "T7 -> T8" or "T7 <- T8" (one way). A side is a value, a range a..b or an
# open range a.. ; "none" means no counterpart. Maps here are applied before the measured vote tables and the alias
# catalog built into the converters, so a line here overrides them.

val:t7_t8_rules_version = 7           # bump on every change (2: requirement conditions, 3: trail VFX ids, 4: t8_to_t7_fix, 5: id = EXPR, 6: t8_to_t7_guard, 7: wall-hit counters, sound 0x84C5)
val:t7_t8_rules_format = 1            # rule syntax; a build ignores files of a format it does not know

